<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corn Method</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090a0f;
            --bg-card: rgba(22, 24, 33, 0.85);
            --bg-dropzone: rgba(30, 33, 46, 0.65);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 180, 255, 0.25);

            --accent-blue: #00b4ff;
            --accent-blue-light: #33d0ff;
            --accent-orange: #ff8800;

            --fg-primary: #ffffff;
            --fg-secondary: #a0a5b5;
            --fg-muted: #656a7b;

            --radius-lg: 16px;
            --radius-xl: 28px;
            --radius-2xl: 36px;

            --font-ui: 'Plus Jakarta Sans', 'Noto Sans Thai', 'Sarabun', Tahoma, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-deep);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--fg-primary);
            overflow-x: hidden;
        }

        /* Starfield background */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Outer Container Card */
        .main-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--border-card);
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .header-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--accent-blue);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Inner Dropzone Box */
        .drop-zone {
            position: relative;
            background: var(--bg-dropzone);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        .drop-zone:hover {
            border-color: var(--border-accent);
            background: rgba(36, 40, 56, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 136, 0, 0.1);
        }

        .drop-zone.dragover {
            border-color: var(--accent-orange);
            background: rgba(45, 50, 70, 0.85);
            transform: scale(1.01);
        }

        /* Upload Icon Badge */
        .icon-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .cloud-icon {
            font-size: 48px;
            color: var(--accent-blue);
            line-height: 1;
            animation: floatCloud 3s ease-in-out infinite;
        }

        @keyframes floatCloud {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloud-icon { animation: none; }
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            stroke: var(--accent-blue);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .drop-zone h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--fg-primary);
            margin-bottom: 10px;
        }

        .drop-zone p {
            font-size: 0.95rem;
            color: var(--fg-secondary);
            font-weight: 500;
        }

        /* Hidden File Input */
        .file-input {
            display: none;
        }

        /* Actions Button Section */
        .actions {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-lg);
            border: none;
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-light));
            color: #0d0e12;
            box-shadow: 0 6px 20px rgba(0, 180, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 180, 255, 0.4);
        }

        .btn-tiktok {
            background: #000;
            color: #fff;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        .btn-tiktok::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: inherit;
            background: linear-gradient(45deg, #00f2fe, #ff0000);
            z-index: -1;
            filter: blur(4px);
            opacity: 0.8;
        }
        .btn-tiktok:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Compatibility / engine-load banner */
        .compat {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: var(--radius-lg);
            background: rgba(255, 136, 0, 0.12);
            border: 1px solid rgba(255, 136, 0, 0.4);
            color: #ffc27a;
            font-size: 0.85rem;
            line-height: 1.5;
            font-weight: 500;
        }
        .compat.error {
            background: rgba(255, 68, 68, 0.12);
            border-color: rgba(255, 68, 68, 0.45);
            color: #ff9a9a;
        }

        .drop-zone:focus-visible, .btn:focus-visible {
            outline: 2px solid var(--accent-blue-light);
            outline-offset: 3px;
        }

        /* File info text when selected */
        .file-info {
            display: none;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="main-card">
        <span class="header-tag">tiktok อย่าแก้บ่อย ขก.แก้ตาม🙏</span>

        <div id="compat" class="compat" role="alert"></div>
        <noscript><div class="compat error" style="display:block">ต้องเปิดใช้งาน JavaScript ก่อนจึงจะใช้งานได้</div></noscript>

        <input type="file" id="videoFileInput" class="file-input" accept="video/*,.mp4,.m4v,.mov">

        <div id="dropZone" class="drop-zone" role="button" tabindex="0">
            <div class="icon-badge">
                <span class="cloud-icon" aria-hidden="true">☁️</span>
            </div>

            <h3>เลือกไฟล์</h3>
            <div id="fileInfo" class="file-info"></div>
            <div id="progressContainer" style="display:none; margin-top:12px; width:100%;">
                <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;">
                    <div id="progressBar" style="width:0%; height:100%; background:linear-gradient(90deg, var(--accent-blue), var(--accent-blue-light)); transition:width 0.3s;"></div>
                </div>
                <div id="progressText" style="margin-top:6px; font-size:0.8rem; color:var(--fg-secondary); text-align:center;"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="processBtn" disabled>เริ่ม</button>
            <button class="btn btn-primary" id="downloadBtn" style="display: none;">ดาวน์โหลดไฟล์</button>
            <button class="btn btn-tiktok" id="tiktokBtn" style="display: none;">
                <img src="tiktok%20logo.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;">
                เปิด TikTok Studio
            </button>
        </div>
    </div>

    <!-- Engine JS (ES modules; versions pinned so a CDN update can't break the page) -->
    <script type="importmap">
    {
        "imports": {
            "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.65.2/+esm",
            "@mediabunny/prores": "https://cdn.jsdelivr.net/npm/@mediabunny/prores@1.65.2/+esm"
        }
    }
    </script>
    <script nomodule>
        // Browsers without ES-module support never run the module script below.
        (function () {
            var el = document.getElementById('compat');
            el.className = 'compat error';
            el.style.display = 'block';
            el.textContent = 'เบราว์เซอร์นี้เก่าเกินไป กรุณาอัปเดตหรือใช้ Chrome / Edge / Safari / Firefox เวอร์ชันล่าสุด';
        })();
    </script>
    <script type="module">
        // The engine is written in TypeScript (src/*.ts). Browsers can't run .ts, and GitHub Pages serves it
        // with a non-JavaScript MIME type, so we fetch each file as text, strip the types in the browser with
        // the TypeScript compiler, and import the result through blob: URLs.
        const TS_URL = 'https://cdn.jsdelivr.net/npm/typescript@5.6.3/lib/typescript.js';
        const ENTRY = './src/pipeline.ts';

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const el = document.createElement('script');
                el.src = src;
                el.onload = resolve;
                el.onerror = () => reject(new Error('โหลดตัวแปลง TypeScript ไม่ได้ (' + src + ')'));
                document.head.appendChild(el);
            });
        }

        const cache = new Map(); // absolute URL -> Promise<blob URL>

        function loadTsModule(url) {
            if (cache.has(url)) return cache.get(url);
            const job = (async () => {
                const res = await fetch(url);
                if (!res.ok) throw new Error('โหลดไฟล์ ' + url + ' ไม่สำเร็จ (HTTP ' + res.status + ')');
                const source = await res.text();
                let js = window.ts.transpileModule(source, {
                    fileName: url,
                    reportDiagnostics: false,
                    compilerOptions: {
                        target: window.ts.ScriptTarget.ES2020,
                        module: window.ts.ModuleKind.ESNext,
                        verbatimModuleSyntax: false,
                        isolatedModules: true,
                    },
                }).outputText;

                // Rewrite relative imports ("./patch", "./patch.js", "./patch.ts") to blob URLs of the compiled dependency.
                const re = /(from\s*|import\s*\(\s*|import\s+)(["'])(\.{1,2}\/[^"']+)\2/g;
                const deps = new Map();
                let m;
                while ((m = re.exec(js)) !== null) {
                    const raw = m[3];
                    if (deps.has(raw)) continue;
                    const base = raw.replace(/\.(js|ts)$/, '');
                    deps.set(raw, new URL(base + '.ts', url).href);
                }
                const resolved = new Map();
                for (const [raw, abs] of deps) resolved.set(raw, await loadTsModule(abs));
                js = js.replace(re, (all, pre, q, raw) => pre + q + resolved.get(raw) + q);

                return URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
            })();
            cache.set(url, job);
            return job;
        }

        async function loadEngine() {
            if (!window.ts) await loadScript(TS_URL);
            const entry = await loadTsModule(new URL(ENTRY, document.baseURI).href);
            const { convert, DEFAULT_RECIPE } = await import(entry);
            window.FISH = { convert, DEFAULT_RECIPE };
            return window.FISH;
        }

        if (window.showCompat && document.getElementById('compat').style.display !== 'block') {
            window.showCompat('กำลังโหลดเอนจิน (ครั้งแรกอาจใช้เวลาสักครู่)...', false);
        }
        window.FISH_PROMISE = loadEngine()
            .then((fish) => {
                return fish;
            })
            .catch((err) => {
                console.error('Engine load failed:', err);
                window.FISH_ERROR = err;
                if (window.showCompat) {
                    window.showCompat('โหลดเอนจินไม่สำเร็จ: ' + (err && err.message ? err.message : err) + ' — ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้า', true);
                }
                throw err;
            });
        window.FISH_PROMISE.catch(() => {});
    </script>
    <script>
        // Starfield background effect
        (function() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createStars() {
                stars = [];
                const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 12000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.4,
                        opacity: Math.random() * 0.7 + 0.3,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.002;

                stars.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.x < 0) s.x = canvas.width;
                    if (s.x > canvas.width) s.x = 0;
                    if (s.y < 0) s.y = canvas.height;
                    if (s.y > canvas.height) s.y = 0;

                    const alpha = s.opacity * (0.6 + 0.4 * Math.sin(time + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                requestAnimationFrame(animate);
            }

            resize();
            createStars();
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                // Draw one static frame, no animation loop.
                stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity * 0.7})`;
                    ctx.fill();
                });
            } else {
                animate();
            }
            window.addEventListener('resize', () => { resize(); createStars(); });
        })();

        // File Selection & Processing Script
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('videoFileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileInfo = document.getElementById('fileInfo');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const tiktokBtn = document.getElementById('tiktokBtn');

        const compat = document.getElementById('compat');
        window.showCompat = function (msg, isError) {
            compat.textContent = msg;
            compat.className = 'compat' + (isError ? ' error' : '');
            compat.style.display = 'block';
        };

        window.hideCompat = function (startsWith) {
            if (!startsWith || compat.textContent.indexOf(startsWith) === 0) compat.style.display = 'none';
        };

        // Capability check: encoding needs WebCodecs (video + audio encoders).
        (function () {
            const hasModules = 'noModule' in HTMLScriptElement.prototype;
            const hasImportMap = !(window.HTMLScriptElement && HTMLScriptElement.supports) || HTMLScriptElement.supports('importmap');
            if (hasModules && !hasImportMap) {
                window.showCompat('เบราว์เซอร์นี้ไม่รองรับ import map กรุณาอัปเดตเบราว์เซอร์เป็นเวอร์ชันล่าสุด', true);
                return;
            }
            const missing = [];
            if (typeof window.VideoEncoder === 'undefined') missing.push('VideoEncoder');
            if (typeof window.AudioEncoder === 'undefined') missing.push('AudioEncoder');
            if (typeof window.VideoDecoder === 'undefined') missing.push('VideoDecoder');
            if (missing.length) {
                window.showCompat('เบราว์เซอร์นี้ไม่รองรับ WebCodecs (' + missing.join(', ') + ') จึงแปลงวิดีโอไม่ได้ แนะนำให้อัปเดตหรือใช้ Chrome / Edge เวอร์ชันล่าสุดบนคอมพิวเตอร์', true);
            }
        })();

        let selectedFile = null;

        const VIDEO_EXT = /\.(mp4|m4v|mov|qt|mkv|webm|3gp)$/i;

        function isVideo(file) {
            // Some browsers/OSes (Windows, Firefox, some Android) leave file.type empty for .mov, so fall back to the extension.
            return (file.type && file.type.startsWith('video/')) || VIDEO_EXT.test(file.name || '');
        }

        function resetResult() {
            const old = downloadBtn.dataset.url;
            if (old) URL.revokeObjectURL(old);
            delete downloadBtn.dataset.url;
            tiktokBtn.style.display = 'none';
            processBtn.style.display = '';
        }

        function handleFile(file) {
            if (!isVideo(file)) {
                alert('กรุณาเลือกไฟล์วิดีโอ');
                return;
            }
            resetResult();
            selectedFile = file;
            fileInfo.style.display = 'block';
            fileInfo.textContent = `ไฟล์ที่เลือก: ${file.name}`;
            processBtn.disabled = false;
            progressContainer.style.display = 'none';
            downloadBtn.style.display = 'none';
            processBtn.textContent = 'เริ่มประมวลผล';
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
            // Allow picking the same file again (otherwise 'change' won't fire).
            fileInput.value = '';
        });

        // Drag and drop handlers
        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
        });
        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            processBtn.disabled = true;
            processBtn.textContent = 'กำลังประมวลผล...';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.style.background = 'linear-gradient(90deg, var(--accent-blue), var(--accent-blue-light))';
            progressText.textContent = 'กำลังอ่านไฟล์...';

            try {
                if (!window.FISH) {
                    progressText.textContent = 'กำลังโหลดเอนจิน...';
                    if (!window.FISH_PROMISE) throw new Error('โหลดเอนจินไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้า)');
                    await window.FISH_PROMISE;
                }

                const result = await window.FISH.convert(selectedFile, window.FISH.DEFAULT_RECIPE, (stage) => {
                    if (typeof stage.progress === 'number') {
                        progressBar.style.width = Math.round(stage.progress * 100) + '%';
                        progressText.textContent = `${stage.label}... ${Math.round(stage.progress * 100)}%`;
                    } else {
                        progressText.textContent = stage.label + '...';
                    }
                });

                progressBar.style.width = '100%';
                progressText.textContent = 'ประมวลผลเสร็จสิ้น';

                const oldUrl = downloadBtn.dataset.url;
                if (oldUrl) URL.revokeObjectURL(oldUrl);
                const url = URL.createObjectURL(result.blob);
                downloadBtn.dataset.url = url;
                downloadBtn.dataset.name = selectedFile.name.replace(/\.[^/.]+$/, '') + '_Corn_Method.mp4';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    processBtn.style.display = 'none';
                    downloadBtn.style.display = 'inline-flex';
                }, 500);

            } catch (err) {
                console.error(err);
                progressText.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
                progressBar.style.background = '#ff4444';
                processBtn.disabled = false;
                processBtn.textContent = 'ลองใหม่';
            }
        });

        downloadBtn.addEventListener('click', () => {
            const url = downloadBtn.dataset.url;
            const name = downloadBtn.dataset.name || 'Corn_Method.mp4';
            if (!url) return;
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Hide download button, show TikTok button
            downloadBtn.style.display = 'none';
            tiktokBtn.style.display = 'inline-flex';
        });

        tiktokBtn.addEventListener('click', () => {
            window.open('https://www.tiktok.com/tiktokstudio/upload', '_blank', 'noopener,noreferrer');
        });
    </script>
</body>
</html>
