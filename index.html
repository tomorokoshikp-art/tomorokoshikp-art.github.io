<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corn Method</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090a0f;
            --bg-card: rgba(22, 24, 33, 0.85);
            --bg-dropzone: rgba(30, 33, 46, 0.65);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 180, 255, 0.25);

            --accent-blue: #00b4ff;
            --accent-blue-light: #33d0ff;

            --fg-primary: #ffffff;
            --fg-secondary: #a0a5b5;
            --fg-muted: #656a7b;

            --radius-lg: 16px;
            --radius-xl: 28px;
            --radius-2xl: 36px;

            --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--fg-primary);
            overflow-x: hidden;
        }

        /* Starfield background */
        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Outer Container Card */
        .main-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--border-card);
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .header-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--accent-blue);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Inner Dropzone Box */
        .drop-zone {
            position: relative;
            background: var(--bg-dropzone);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        .drop-zone:hover {
            border-color: var(--border-accent);
            background: rgba(36, 40, 56, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 136, 0, 0.1);
        }

        .drop-zone.dragover {
            border-color: var(--accent-orange);
            background: rgba(45, 50, 70, 0.85);
            scale: 1.01;
        }

        /* Upload Icon Badge */
        .icon-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .cloud-icon {
            font-size: 48px;
            color: var(--accent-blue);
            line-height: 1;
            animation: floatCloud 3s ease-in-out infinite;
        }

        @keyframes floatCloud {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloud-icon { animation: none; }
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            stroke: var(--accent-blue);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .drop-zone h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--fg-primary);
            margin-bottom: 10px;
        }

        .drop-zone p {
            font-size: 0.95rem;
            color: var(--fg-secondary);
            font-weight: 500;
        }

        /* Hidden File Input */
        .file-input {
            display: none;
        }

        /* Actions Button Section */
        .actions {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-lg);
            border: none;
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-light));
            color: #0d0e12;
            box-shadow: 0 6px 20px rgba(0, 180, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 180, 255, 0.4);
        }

        .btn-tiktok {
            background: #000;
            color: #fff;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        .btn-tiktok::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(45deg, #00f2fe, #ff0000);
            z-index: -1;
            filter: blur(4px);
            opacity: 0.8;
        }
        .btn-tiktok:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* File info text when selected */
        .file-info {
            display: none;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="main-card">
        <span class="header-tag">VIDEO</span>

        <input type="file" id="videoFileInput" class="file-input" accept="video/*">

        <div id="dropZone" class="drop-zone" role="button" tabindex="0">
            <div class="icon-badge">
                <span class="cloud-icon" aria-hidden="true">☁️</span>
            </div>

            <h3>Select file</h3>
            <div id="fileInfo" class="file-info"></div>
            <div id="progressContainer" style="display:none; margin-top:12px; width:100%;">
                <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;">
                    <div id="progressBar" style="width:0%; height:100%; background:linear-gradient(90deg, var(--accent-blue), var(--accent-blue-light)); transition:width 0.3s;"></div>
                </div>
                <div id="progressText" style="margin-top:6px; font-size:0.8rem; color:var(--fg-secondary); text-align:center;"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="processBtn" disabled>เริ่มประมวลผล</button>
            <button class="btn btn-primary" id="downloadBtn" style="display: none;">ดาวน์โหลดไฟล์</button>
            <button class="btn btn-tiktok" id="tiktokBtn" style="display: none;">
                <img src="/tiktok-logo.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;">
                เปิด TikTok Studio
            </button>
        </div>
    </div>

    <script>
        // Starfield background effect
        (function() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createStars() {
                stars = [];
                const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 12000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.4,
                        opacity: Math.random() * 0.7 + 0.3,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.002;

                stars.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.x < 0) s.x = canvas.width;
                    if (s.x > canvas.width) s.x = 0;
                    if (s.y < 0) s.y = canvas.height;
                    if (s.y > canvas.height) s.y = 0;

                    const alpha = s.opacity * (0.6 + 0.4 * Math.sin(time + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                requestAnimationFrame(animate);
            }

            resize();
            createStars();
            animate();
            window.addEventListener('resize', () => { resize(); createStars(); });
        })();
    </script>

    <!-- Engine: patch.ts + silentTail.ts + pipeline.ts (bundled by Vite) -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
