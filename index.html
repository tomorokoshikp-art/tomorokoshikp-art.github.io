<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok HQ Upload - FISH Method & Direct Pass-Through</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0f19;
            background: radial-gradient(circle at center, #1a1f2e 0%, #0b0f19 70%, #05080d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #06b6d4);
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
            position: relative;
            z-index: 2;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }

        .content {
            padding: 30px;
        }

        .upload-section {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        .upload-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .upload-section:hover {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(30, 41, 59, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.2);
        }

        .upload-section:hover::before {
            opacity: 1;
        }

        .upload-section.dragover {
            border: 2px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25),
                        0 8px 32px rgba(139, 92, 246, 0.4);
        }

        .upload-section.dragover::before {
            opacity: 0;
        }

        .upload-icon {
            font-size: 4.5rem;
            margin-bottom: 24px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(139, 92, 246, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .upload-section h3 {
            margin-bottom: 16px;
            color: #e2e8f0;
            font-size: 1.4rem;
            font-weight: 600;
            min-height: 24px;
            transition: all 0.3s ease;
        }

        .upload-section p {
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .file-types {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
            text-transform: none;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            height: 52px;
            min-width: 140px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, #a78bfa, #f472b6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .process-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
        }

        .process-btn:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
        }

        .download-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
        }

        .progress-section {
            display: none;
            margin: 20px 0;
            width: 100%;
            text-align: center;
        }

        .progress-text {
            margin-bottom: 12px;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 6px;
            overflow: hidden;
            margin: 12px 0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #06b6d4);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        .progress-percent {
            margin-top: 8px;
            font-weight: 600;
            color: #8b5cf6;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }

            .content {
                padding: 20px;
            }

            .upload-section {
                padding: 30px;
            }

            .btn {
                padding: 14px 24px;
                font-size: 1rem;
                height: 48px;
                min-width: 120px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 1rem;
            }

            .upload-section {
                padding: 24px;
            }

            .upload-icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Corn Method</h1>
            <p>ตอนนี้ยังเป็น BETA อยู่ยังมีบัคแอพ Alight Motion</p>
        </div>

        <div class="content">
            <div class="upload-section" id="uploadSection">
                <!-- Hidden File Input -->
                <input type="file" id="videoFileInput" accept="video/*" style="display: none;" onchange="handleFileSelected(event)">

                <!-- Drag & Drop Area (Clickable) -->
                <div id="dropZone" style="border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 40px; text-align: center; transition: all 0.4s ease; margin-bottom: 25px; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); pointer-events: auto; cursor: pointer;" onclick="document.getElementById('videoFileInput').click()">
                    <div class="upload-icon" style="font-size: 4.5rem; margin-bottom: 24px; color: #8b5cf6;">☁️</div>
                    <h3 id="fileDisplayText" style="margin-bottom: 16px; color: #e2e8f0;">เลือกวิดีโอที่จะอัปโหลด</h3>
                    <p style="color: #94a3b8; margin-bottom: 24px;">หรือลากแล้ววางไฟล์ที่นี่</p>
                    <p class="file-types" style="margin-top: 12px; font-size: 0.9rem; color: #64748b;">Supported: MP4, MOV, WebM, AVI, MKV</p>

                    <!-- Progress Section (moved to top) -->
                    <div class="progress-section" id="progressSection">
                        <div class="progress-text" id="progressText">เตรียมพร้อมสำหรับการประมวลผล...</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-percent" id="progressPercent">0%</div>
                    </div>
                </div>

                <!-- Process Button and Download Button -->
                <div id="processButtonContainer" style="text-align: center; margin: 28px 0;">
                    <button class="btn process-btn" id="processBtn" disabled>เริ่มประมวลผล</button>
                    <button class="btn download-btn" id="downloadBtn" style="display: none;">ดาวน์โหลดผลลัพธ์</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load FISH Method Engine -->
    <script src="/src/fish.js"></script>
    <script>
        // Initialize FISH module
        const FISH_MODULE = typeof FISH !== 'undefined' ? FISH : require('./src/fish.js');

        const uploadSection = document.getElementById('uploadSection');
        const fileName = document.getElementById('fileName'); // Keeping for compatibility but not used
        const fileSize = document.getElementById('fileSize'); // Keeping for compatibility but not used
        const fileDisplayText = document.getElementById('fileDisplayText');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressSection = document.getElementById('progressSection');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const dropZone = document.getElementById('dropZone');

        let selectedFile = null;
        let startTime = null;

        // Initialize upload section
        function initUploadSection() {
            console.log('initUploadSection called');
            if (!dropZone) {
                console.error('dropZone element not found');
                return;
            }
            console.log('dropZone found');
            // Process button click
            processBtn.addEventListener('click', () => {
                processVideo();
            });

            // Drag and drop - Enhanced with proper event handling
            dropZone.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
                handleFileSelected(e);
            });
        }

        function handleFileSelected(e) {
            const file = e.target.files ? e.target.files[0] : (e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null);
            if (!file) {
                console.log('No file selected');
                return;
            }
            console.log('File selected:', file.name);

            // Validate file type
            if (!file.type.startsWith('video/')) {
                showError('กรุณาเลือกไฟล์วิดีโอที่ถูกต้อง');
                return;
            }

            selectedFile = file;
            // Update the main display text to show filename and size
            fileDisplayText.innerHTML = `📄 ${file.name} (${formatFileSize(file.size)})`;

            // Enable process button
            processBtn.disabled = false;

            // Reset UI (progress section will be shown when processing starts)
            resetUI();
        }

        function resetUI() {
            progressSection.style.display = 'none';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            progressText.textContent = 'พร้อมประมวลผลวิดีโอด้วย FISH Method...';
            downloadBtn.style.display = 'none';
            processBtn.style.display = 'inline-flex';

            // Reset file display text if no file selected
            if (!selectedFile) {
                fileDisplayText.textContent = 'เลือกวิดีโอที่จะอัปโหลด';
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Process video using REAL FISH method
        async function processVideo() {
            if (!selectedFile) {
                showError('กรุณาเลือกไฟล์วิดีโอก่อน');
                return;
            }

            startTime = Date.now();

            try {
                // Show progress section
                progressSection.style.display = 'block';
                processBtn.disabled = true;
                downloadBtn.disabled = true;
                downloadBtn.style.display = 'none';
                processBtn.style.display = 'inline-flex';

                progressText.textContent = 'กำลังเริ่มต้น FISH processor...';
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';

                // Read file as ArrayBuffer
                const arrayBuffer = await selectedFile.arrayBuffer();
                const originalSize = arrayBuffer.byteLength;

                // Simulate processing steps for UI feedback while doing real FISH processing
                const totalSteps = 100;
                let currentStep = 0;

                // Update progress bar periodically
                const progressInterval = setInterval(() => {
                    currentStep = Math.min(currentStep + 1, totalSteps - 1);
                    const progressPercent = (currentStep / totalSteps) * 100;
                    progressFill.style.width = progressPercent + '%';
                    progressPercent.textContent = Math.round(progressPercent) + '%';
                }, 50); // Update every 50ms

                // Update progress text with steps
                const progressSteps = [
                    'กำลังเริ่มต้น FISH processor...',
                    'กำลังอ่านหัวไฟล์ MP4...',
                    'กำลังวิเคราะห์โครงสร้าง ftyp, moov, mdat atoms...',
                    'กำลังตรวจสอบความถูกต้องของ MP4 structure...',
                    'กำลังดึงข้อมูล track ออกมา...',
                    'กำลังใช้ V1 64-bit Infinite Duration Sentinel...',
                    'กำลังปรับ timescale ของ video track เป็น 48000...',
                    'กำลังปรับ timescale ของ audio track เป็น 48000...',
                    'กำลังฉีด Zero-Offset CTTS Table...',
                    'กำลังเพิ่ม In-track Video Anchor Sample...',
                    'กำลังวาง Micro-Shield Stream Trap บน Track 3...',
                    'กำลังสร้าง MP4 atoms ใหม่ด้วยการดัดแปลง FISH...',
                    'กำลังทำให้ Direct Pass-Through output เสร็จสมบูรณ์...',
                    'กำลังคำนวณขนาดไฟล์ output...',
                    'การประมวลผลเสร็จสมบูรณ์แล้ว!'
                ];

                let stepIndex = 0;
                const stepInterval = setInterval(() => {
                    if (stepIndex < progressSteps.length) {
                        progressText.textContent = progressSteps[stepIndex];
                        stepIndex++;
                    }
                }, 200); // Change step every 200ms

                // Process with REAL FISH method
                const processedBuffer = FISH_MODULE.patchMp4Fish(arrayBuffer, (message) => {
                    // Logging removed
                });

                // Stop progress simulations
                clearInterval(progressInterval);
                clearInterval(stepInterval);

                // Finalize progress UI
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                progressText.textContent = 'การประมวลผลด้วย FISH method เสร็จสมบูรณ์แล้ว!';

                // Create blob for download
                const blob = new Blob([processedBuffer], { type: selectedFile.type });
                const url = URL.createObjectURL(blob);

                // Setup download
                downloadBtn.onclick = () => {
                    const fileNameParts = selectedFile.name.split('.');
                    const extension = fileNameParts.pop();
                    const nameWithoutExt = fileNameParts.join('.');
                    const downloadName = `${nameWithoutExt}_Corn_Method.${extension}`;

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = downloadName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                // Show download button after delay
                setTimeout(() => {
                    progressSection.style.display = 'none';
                    processBtn.style.display = 'none';
                    downloadBtn.style.display = 'inline-flex';
                    downloadBtn.disabled = false;
                }, 500);

            } catch (error) {
                console.error('Processing error:', error);
                showError('การประมวลผลล้มเหลว: ' + error.message);

                // Re-enable process button on error
                processBtn.disabled = false;
            }
        }

        function showError(message) {
            alert(message);
            resetUI();
        }

        // Initialize
        try {
            initUploadSection();
        } catch (e) {
            console.error('Error initializing upload section:', e);
            alert('ไม่สามารถเริ่มต้นส่วนอัปโหลดได้ ดูรายละเอียดใน console');
        }
    </script>
</body>
</html>
